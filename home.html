<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="小学数学趣味练习 - 数数、数数字、奇偶判断">
    <title>小学数学趣味练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFF5E6 100%);
            min-height: 100vh;
            color: #5D5A66;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: #FF9AAB;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            color: #888;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(255, 154, 171, 0.15);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(255, 154, 171, 0.25);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .card h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            color: #5D5A66;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.95rem;
            color: #999;
            line-height: 1.6;
        }

        .card .arrow {
            float: right;
            font-size: 1.5rem;
            color: #FF9AAB;
            transition: transform 0.3s;
        }

        .card:hover .arrow {
            transform: translateX(5px);
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: #bbb;
            font-size: 0.85rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 响应式 ========== */
        @supports (padding: env(safe-area-inset-bottom)) {
            .container {
                padding-left: calc(20px + env(safe-area-inset-left));
                padding-right: calc(20px + env(safe-area-inset-right));
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 15px;
            }

            .header {
                margin-bottom: 30px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .cards {
                gap: 15px;
            }

            .card {
                padding: 20px;
                border-radius: 20px;
            }

            .card-icon {
                font-size: 2.5rem;
            }

            .card h2 {
                font-size: 1.2rem;
            }

            .card p {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 360px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .card h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🧮 小学数学趣味练习 🧮</h1>
            <p>边玩边学，快乐数学</p>
        </header>

        <div class="cards">
            <a href="counting.html" class="card">
                <div class="card-icon">🔢</div>
                <h2>数数与数数字 <span class="arrow">→</span></h2>
                <p>数数练习、数数字练习、数页码练习<br>帮助理解数字和位数的关系</p>
            </a>

            <a href="index.html" class="card">
                <div class="card-icon">🧦</div>
                <h2>01大法 <span class="arrow">→</span></h2>
                <p>用可爱的袜子学习奇偶判断<br>轻松掌握奇数和偶数的奥秘</p>
            </a>
        </div>

        <footer class="footer">
            适合小学生数学启蒙练习
        </footer>
    </div>
</body>
</html>
